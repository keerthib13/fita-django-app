<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sentiment Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f6f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
            width: 350px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin-top: 10px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: none;
        }
        button {
            margin-top: 15px;
            width: 100%;
            background: royalblue;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover {
            background: #2c57c7;
        }
        #result {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
        a.back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #333;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>💬 Sentiment Prediction</h2>
    <textarea id="review" placeholder="Type customer feedback here..."></textarea>
    <button onclick="predictSentiment()">Predict Sentiment</button>

    <div id="result"></div>

    <a class="back" href="{% url 'home' %}">⬅ Back to Home</a>
</div>

<script>
async function predictSentiment() {
    const text = document.getElementById('review').value;
    if (!text.trim()) {
        alert('Please enter some text');
        return;
    }

    const formData = new FormData();
    formData.append('text', text);

    const response = await fetch("{% url 'predict' %}", {
        method: "POST",
        headers: {
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: formData
    });

    const data = await response.json();
    document.getElementById('result').innerText = "Sentiment: " + data.sentiment;
}
</script>

</body>
</html>
