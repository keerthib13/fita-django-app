{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Restaurant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e8f0fe;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        form {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }
        label {
            display: block;
            margin-top: 10px;
            font-size: 14px;
            color: #555;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            outline: none;
            border-color: royalblue;
        }
        button {
            margin-top: 20px;
            width: 100%;
            background: royalblue;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        button:hover {
            background: #2c57c7;
        }
        .msg {
            margin-top: 15px;
            padding: 10px;
            text-align: center;
            border-radius: 5px;
            font-size: 14px;
        }
        .msg.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .msg.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        a.back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #333;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        a.back:hover {
            color: royalblue;
        }
    </style>
</head>
<body>
    <form method="POST">
        {% csrf_token %}
        <h2>Register Restaurant</h2>
        
        <label for="name">Restaurant Name:</label>
        <input type="text" id="name" name="name" required placeholder="Enter restaurant name">
        
        <label for="rating">Rating (0-5):</label>
        <input type="number" id="rating" name="rating" step="0.1" min="0" max="5" required placeholder="e.g., 4.5">
        
        <label for="city">City:</label>
        <input type="text" id="city" name="city" required placeholder="Enter city">
        
        <label for="category">Category:</label>
        <select id="category" name="category" required>
            <option value="">-- Select Category --</option>
            <option value="Veg">Veg</option>
            <option value="Non-Veg">Non-Veg</option>
            <option value="Cafe">Cafe</option>
        </select>
        
        <button type="submit">Register Restaurant</button>
        
        {% if message %}
            {% if 'Error' in message %}
                <div class="msg error">{{ message }}</div>
            {% else %}
                <div class="msg success">{{ message }}</div>
            {% endif %}
        {% endif %}
        
        <a class="back" href="{% url 'home' %}">⬅ Back to Home</a>
    </form>
</body>
</html>
