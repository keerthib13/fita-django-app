<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register Restaurant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e8f0fe;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        form {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
            width: 300px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        label {
            display: block;
            margin-top: 10px;
            font-size: 14px;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            margin-top: 15px;
            width: 100%;
            background: royalblue;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover {
            background: #2c57c7;
        }
        .msg {
            margin-top: 10px;
            text-align: center;
            color: green;
        }
        a.back {
            display: block;
            text-align: center;
            margin-top: 10px;
            color: #333;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

<form method="POST">
    {% csrf_token %}
    <h2>Register Restaurant</h2>

    <label>Name:</label>
    <input type="text" name="name" required>

    <label>Rating:</label>
    <input type="number" name="rating" step="0.1" min="0" max="5" required>

    <label>City:</label>
    <input type="text" name="city" required>

    <label>Category:</label>
    <select name="category" required>
        <option value="">-- Select --</option>
        <option value="Veg">Veg</option>
        <option value="Non-Veg">Non-Veg</option>
        <option value="Cafe">Cafe</option>
    </select>

    <button type="submit">Register</button>

    {% if message %}
    <div class="msg">{{ message }}</div>
    {% endif %}

    <a class="back" href="{% url 'home' %}">⬅ Back to Home</a>
</form>

</body>
</html>
